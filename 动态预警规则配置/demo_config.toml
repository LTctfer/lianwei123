[alarm_rule]
alarmRuleId = "ENT_001"
alarmRuleName = "企业排放违规预警"
alarmClazz = "ENTERPRISE_ALARM"
alarmType = "2"
alarmLevel = "CRITICAL"
alarmInternal = 0
dataInternal = "1m"
algorithmType = "emission_detection"
calculateWay = "statistical"
enabled = 1
startTime = "00:00"
endTime = "23:59"
showProperties = ["emission_level", "work_status"]

[[device_alarm_config.singlePropertyRule]]
symbol = "OR"
property = "temperature"
lowValue = 0
expression1 = "lt"
highValue = 50
expression2 = "gt"

[[device_alarm_config.singlePropertyRule]]
symbol = "OR"
property = "humidity"
lowValue = 20
expression1 = "lt"
highValue = 80
expression2 = "gt"
[[device_alarm_config.doublePropertyRule]]
symbol = "AND"
leftProperty = "temperature"
rightProperty = "humidity"
expression = "gt"
[device_alarm_config.frequency]
enabled = 1
hasAccumulate = 0
accumulateCount = 3
accumulateTimeRange = 5
continuousCount = 2

[enterprise_alarm_config]
algorithmType = "emission_monitor_v2"
workStatus = ["working", "maintenance"]

[[enterprise_alarm_config.singlePropertyRule]]
symbol = "OR"
property = "emission_level"
lowValue = 0
expression1 = "lt"
highValue = 100
expression2 = "gt"
[enterprise_alarm_config.frequency]
enabled = 1
hasAccumulate = 0
continuousCount = 1
